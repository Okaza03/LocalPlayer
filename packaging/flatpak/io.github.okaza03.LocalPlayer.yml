# Packages the release binary CI builds on Ubuntu 22.04 (target/release/localplayer)
# instead of compiling inside flatpak-builder, which would need vendored crates and
# an offline FFmpeg build. A binary built on a newer distro won't run here: the
# runtime's glibc must be at least as new as the build machine's.
id: io.github.okaza03.LocalPlayer
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: localplayer
finish-args:
  - --share=network        # media server, update check
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio    # ALSA output goes through the runtime's pulse plugin
  - --device=dri
  - --filesystem=xdg-videos:ro   # other files come in via the file-chooser portal
modules:
  - name: localplayer
    buildsystem: simple
    build-commands:
      - install -Dm755 localplayer /app/bin/localplayer
      - install -Dm644 localplayer.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - sed 's/^Icon=localplayer$/Icon='"${FLATPAK_ID}"'/' localplayer.desktop > ${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.desktop -t /app/share/applications
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo
    sources:
      - type: file
        path: ../../target/release/localplayer
      - type: file
        path: ../localplayer.desktop
      - type: file
        path: ../localplayer.svg
      - type: file
        path: io.github.okaza03.LocalPlayer.metainfo.xml
